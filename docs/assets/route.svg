<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">Route a job: from /graph to one session, /graph fan-out, /bakeoff or /dag</title>
  <desc id="d">A decision flow. Start with /graph. If steps depend on each other, the job is small, or it is unclear what you are looking for, use one steerable session in a worktree. Otherwise, if the work is wide, independent and checkable and the parallel share p is at least 0.7, /graph fans it out. Otherwise, if it is a large build and the experiment is still open, use /bakeoff. If it must survive a session or leave the machine, it becomes a /dag job.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#17212a"/></marker>
  </defs>
  <style>
    text { font-family: "Atkinson Hyperlegible", Helvetica, Arial, sans-serif; fill: #17212a; font-size: 19px; }
    .h { font-size: 26px; font-weight: 700; }
    .b { font-weight: 700; }
    .muted { fill: #586672; }
    .q { fill: #f4f6f7; stroke: #586672; stroke-width: 2.5; }
    .e { fill: none; stroke: #17212a; stroke-width: 3; }
    .hl { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .hl { animation: glow 10s ease-in-out infinite; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: 2s; } .d3 { animation-delay: 4s; } .d4 { animation-delay: 6s; }
    }
    @keyframes glow { 0%, 30%, 100% { opacity: 0; } 10%, 20% { opacity: 0.22; } }
  </style>
  <rect x="1" y="1" width="958" height="618" rx="18" fill="#ffffff" stroke="#d6dde2" stroke-width="2"/>

  <!-- start -->
  <rect x="30" y="20" width="540" height="50" rx="25" fill="#eaf0fb" stroke="#2a62c4" stroke-width="2.5"/>
  <text x="300" y="52" text-anchor="middle" class="b">1  Start with /graph: it plans the job</text>
  <path class="e" d="M300 70 V100" marker-end="url(#ar)"/>

  <!-- Q1 -->
  <rect class="q" x="30" y="102" width="540" height="84" rx="12"/>
  <text x="300" y="134" text-anchor="middle">Do the steps depend on each other, is the job small,</text>
  <text x="300" y="162" text-anchor="middle">or is it unclear what you are looking for?</text>
  <path class="e" d="M570 144 H628" marker-end="url(#ar)"/>
  <text x="599" y="134" text-anchor="middle" class="muted" style="font-size:18px">yes</text>
  <rect x="632" y="102" width="298" height="84" rx="12" fill="#eef1f3" stroke="#586672" stroke-width="2.5"/>
  <text x="781" y="134" text-anchor="middle" class="b">one steerable session</text>
  <text x="781" y="162" text-anchor="middle">in a worktree</text>
  <path class="e" d="M300 186 V222" marker-end="url(#ar)"/>
  <text x="316" y="210" class="muted" style="font-size:18px">no</text>

  <!-- Q2 -->
  <rect class="q" x="30" y="224" width="540" height="84" rx="12"/>
  <text x="300" y="256" text-anchor="middle">Is the work wide, independent and checkable,</text>
  <text x="300" y="284" text-anchor="middle">and is the parallel share p at least 0.7?</text>
  <path class="e" d="M570 266 H628" marker-end="url(#ar)"/>
  <text x="599" y="256" text-anchor="middle" class="muted" style="font-size:18px">yes</text>
  <rect x="632" y="224" width="298" height="84" rx="12" fill="#eaf0fb" stroke="#2a62c4" stroke-width="2.5"/>
  <text x="781" y="256" text-anchor="middle" class="b">/graph fans it out</text>
  <text x="781" y="284" text-anchor="middle">lanes, then verify</text>
  <rect class="hl d2" x="632" y="224" width="298" height="84" rx="12" fill="#2a62c4"/>
  <path class="e" d="M300 308 V344" marker-end="url(#ar)"/>
  <text x="316" y="332" class="muted" style="font-size:18px">no</text>

  <!-- Q3 -->
  <rect class="q" x="30" y="346" width="540" height="84" rx="12"/>
  <text x="300" y="378" text-anchor="middle">Is it a large build,</text>
  <text x="300" y="406" text-anchor="middle">and is the experiment still open?</text>
  <path class="e" d="M570 388 H628" marker-end="url(#ar)"/>
  <text x="599" y="378" text-anchor="middle" class="muted" style="font-size:18px">yes</text>
  <rect x="632" y="346" width="298" height="84" rx="12" fill="#fbf3e3" stroke="#a36a12" stroke-width="2.5"/>
  <text x="781" y="378" text-anchor="middle" class="b">/bakeoff</text>
  <text x="781" y="406" text-anchor="middle">build twice, one frozen plan</text>
  <rect class="hl d3" x="632" y="346" width="298" height="84" rx="12" fill="#a36a12"/>
  <path class="e" d="M300 430 V466" marker-end="url(#ar)"/>
  <text x="316" y="454" class="muted" style="font-size:18px">no</text>

  <!-- Q4 -->
  <rect class="q" x="30" y="468" width="540" height="84" rx="12"/>
  <text x="300" y="500" text-anchor="middle">Does it have to survive a session</text>
  <text x="300" y="528" text-anchor="middle">or leave the machine?</text>
  <path class="e" d="M570 510 H628" marker-end="url(#ar)"/>
  <text x="599" y="500" text-anchor="middle" class="muted" style="font-size:18px">yes</text>
  <rect x="632" y="468" width="298" height="84" rx="12" fill="#e3f2ed" stroke="#1f7a5e" stroke-width="2.5"/>
  <text x="781" y="500" text-anchor="middle" class="b">/dag job</text>
  <text x="781" y="528" text-anchor="middle">checks, a gate, then ship</text>
  <rect class="hl d4" x="632" y="468" width="298" height="84" rx="12" fill="#1f7a5e"/>
  <rect class="hl d1" x="632" y="102" width="298" height="84" rx="12" fill="#586672"/>

  <text x="480" y="592" text-anchor="middle" class="muted">One state file per job: never track the same tasks in two stores.</text>
</svg>
